name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FLAP_TEMPLATE_FRESHNESS_REF: ${{ github.event_name == 'pull_request' && format('origin/pr-{0}-head', github.event.number) || 'origin/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Register PR candidate freshness ref
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "+refs/pull/${{ github.event.number }}/head:refs/remotes/origin/pr-${{ github.event.number }}-head"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Validate
        run: yarn ci

      - name: Upload generated validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flap-vault-ui-template-dist
          path: |
            dist/*.zip
            dist/e2e/**
            dist/vault-runtime/**
          if-no-files-found: error
          retention-days: 7
