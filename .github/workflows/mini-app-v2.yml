name: Mini App v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'flap-sh/flap-vault-component-template' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FLAP_TEMPLATE_CHANNEL: latest
      FLAP_TEMPLATE_FRESHNESS_REF: origin/main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:preview-process
      - run: yarn test:launch-config
      - run: yarn test:launch-config:browser
      - run: yarn test:release-channel
      - run: yarn test:mini-app
      - run: yarn test:mini-app-routing
      - run: yarn test:standalone-app
      - run: yarn test:runtime-package-mode
      - run: yarn run check
      - run: yarn app:check standalone-example
      - run: yarn app:e2e standalone-example
      - run: yarn app:build
      - run: yarn runtime:pack:canary
      - uses: actions/upload-artifact@v4
        with:
          name: mini-app-v2-validation
          path: |
            dist/e2e/standalone-example/**
            dist/npm/*.tgz
          retention-days: 7
